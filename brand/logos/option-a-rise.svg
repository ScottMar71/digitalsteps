    <path d="M6 90 H30 V64 H54 V38 H78 V22" fill="none" stroke="#1C1C1A" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="7" r="7" fill="#E2561F"/>
  </g>
  <!-- Wordmark: Instrument Sans Medium, lowercase. Convert to outlines for final artwork. -->
  <text x="124" y="74" fill="#1C1C1A" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="500" letter-spacing="-1">digital steps</text>
</svg>
