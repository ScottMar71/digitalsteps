<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120" role="img" aria-label="Digital Steps  Option B, Stack">
  <title>Digital Steps  Option B Stack</title>
  <!-- Mark: three ascending blocks; the top block is ember. -->
  <g transform="translate(12 12)">
    <rect x="4" y="62" width="24" height="30" rx="6" fill="#1C1C1A"/>
    <rect x="34" y="36" width="24" height="56" rx="6" fill="#1C1C1A"/>
    <rect x="64" y="4" width="24" height="88" rx="6" fill="#E2561F"/>
  </g>
  <!-- Wordmark stacked on two lines to echo the mark. -->
  <text fill="#1C1C1A" font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="500" letter-spacing="-1">
    <tspan x="124" y="56">digital</tspan>
    <tspan x="124" y="100">steps</tspan>
  </text>
</svg>
